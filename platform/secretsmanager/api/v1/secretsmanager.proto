syntax = "proto3";

package motiveiq.secretsmanager.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/MotiveIQ/public/platform/secretsmanager/api/v1;secretsmanagerv1";

// Unary gRPC API for encrypted, versioned secrets.
// Clients authenticate ordinary requests with the shared proof-bound IAM SDK.
// No public method accepts a delegation profile, KMS ciphertext, encryption
// context, or issuer credential. Internal delegation preserves the original
// caller's permissions on both the secret and the KMS key.
service SecretsManager {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc PutSecretValue(PutSecretValueRequest) returns (PutSecretValueResponse);
  rpc GetSecretValue(GetSecretValueRequest) returns (GetSecretValueResponse);
  rpc DescribeSecret(DescribeSecretRequest) returns (SecretMetadata);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);
  rpc UpdateSecret(UpdateSecretRequest) returns (SecretMetadata);
  rpc DeleteSecret(DeleteSecretRequest) returns (SecretMetadata);
  rpc RestoreSecret(RestoreSecretRequest) returns (SecretMetadata);
}

// Exactly one nonempty selector. The independent source-resource boundary uses
// the signed URN. Names require explicitly trusted catalog resolution and must
// never be promoted to verified request URNs by the delegation issuer.
message SecretSelector {
  oneof selector {
    string name = 1;
    string urn = 2; // canonical urn:motiveiq:secretsmanager:secret/<uuid>
  }
}

// Exactly one value, 1..65536 bytes. String values must be valid UTF-8; the
// service does not interpret JSON. Both representations are sensitive.
message SecretValue {
  oneof value {
    string string_value = 1 [debug_redact = true];
    bytes binary_value = 2 [debug_redact = true];
  }
}

enum SecretValueKind {
  SECRET_VALUE_KIND_UNSPECIFIED = 0;
  SECRET_VALUE_KIND_STRING = 1;
  SECRET_VALUE_KIND_BINARY = 2;
}

enum SecretState {
  SECRET_STATE_UNSPECIFIED = 0;
  SECRET_STATE_ACTIVE = 1;
  SECRET_STATE_PENDING_DELETION = 2;
  SECRET_STATE_DELETED = 3;
}

message SecretMetadata {
  string urn = 1;
  string name = 2;
  string description = 3;
  string kms_key_urn = 4;
  int64 revision = 5;
  SecretState state = 6;
  string current_version_id = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  google.protobuf.Timestamp deletion_time = 10; // present only while pending deletion
}

// Metadata only; never includes a value, ciphertext, wrapped key, or checksum.
message SecretVersionMetadata {
  string secret_urn = 1;
  string version_id = 2;
  SecretValueKind value_kind = 3;
  uint32 value_size_bytes = 4;
  google.protobuf.Timestamp create_time = 5;
  bool current = 6; // observed current pointer, not a mutable version property
}

// Every mutation carries a client-generated UUID request_id. Receipts are scoped
// to immutable caller role ID, source identity, and RPC, not the transport proof
// ID. An exact retry returns the committed result; changing fields/value conflicts.
message CreateSecretRequest {
  string name = 1; // immutable path, 1..8 segments and at most 255 ASCII bytes
  string kms_key_urn = 2; // explicit immutable key URN; no aliases/default key
  string description = 3; // optional, at most 1024 UTF-8 bytes
  SecretValue value = 4 [debug_redact = true];
  string request_id = 5;
}

message CreateSecretResponse {
  SecretMetadata secret = 1;
  SecretVersionMetadata version = 2;
}

message PutSecretValueRequest {
  string secret_urn = 1; // required existing-resource URN, independently bound
  SecretValue value = 2 [debug_redact = true];
  string request_id = 3;
  int64 expected_revision = 4; // required positive CAS; exact retries keep the old value
}

message PutSecretValueResponse {
  SecretMetadata secret = 1;
  SecretVersionMetadata version = 2;
}

message GetSecretValueRequest {
  SecretSelector secret = 1;
  // Empty selects current. An exact version must belong to the selected secret.
  // Read permission covers retained versions; version selection remains catalog
  // logic in the initial independently verified resource-URN boundary.
  string version_id = 2;
}

message GetSecretValueResponse {
  string secret_urn = 1;
  string version_id = 2;
  google.protobuf.Timestamp create_time = 3; // version creation time
  SecretValue value = 4 [debug_redact = true];
}

message DescribeSecretRequest { SecretSelector secret = 1; }

message ListSecretsRequest {
  uint32 page_size = 1; // zero defaults to 50; maximum 100
  string page_token = 2; // opaque continuation, never authorization
  string name_prefix = 3;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message ListSecretVersionsRequest {
  SecretSelector secret = 1;
  uint32 page_size = 2; // zero defaults to 50; maximum 100
  string page_token = 3;
}

message ListSecretVersionsResponse {
  repeated SecretVersionMetadata versions = 1;
  string next_page_token = 2;
}

// V1 updates only the description. Name and KMS key cannot be changed.
message UpdateSecretRequest {
  string secret_urn = 1;
  string description = 2; // empty clears the description
  string request_id = 3;
  int64 expected_revision = 4;
}

// Fixed seven-day recovery period; no force-delete parameter. Metadata remains
// inspectable, but value operations fail once deletion admission has closed.
message DeleteSecretRequest {
  string secret_urn = 1;
  string request_id = 2;
  int64 expected_revision = 3;
}

// Valid only before the deletion deadline, regardless of purge-job progress.
message RestoreSecretRequest {
  string secret_urn = 1;
  string request_id = 2;
  int64 expected_revision = 3;
}
