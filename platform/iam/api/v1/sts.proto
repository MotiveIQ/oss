syntax = "proto3";

package motiveiq.iam.v1;

import "google/protobuf/timestamp.proto";
import "platform/iam/api/v1/authentication.proto";

option go_package = "go.motiveiq.dev/platform/iam/api/v1;iamv1";

// STS exchanges verified external OIDC identities for short-lived
// assumed-role sessions (DESIGN.md "STS"). Session tokens are carried in
// request metadata together with a per-request proof.
service STS {
  rpc AssumeRoleWithWebIdentity(AssumeRoleWithWebIdentityRequest)
      returns (AssumeRoleWithWebIdentityResponse);
  // GetCallerIdentity reads the proof-bound session from request metadata and
  // answers from the validated token alone; no database read.
  rpc GetCallerIdentity(GetCallerIdentityRequest)
      returns (GetCallerIdentityResponse);

}

message AssumeRoleWithWebIdentityRequest {
  string role_urn = 1;
  string web_identity_token = 2 [debug_redact = true];
  // Optional; STS generates a session name when empty. Constrained to
  // [A-Za-z0-9._-]{1,64}.
  string session_name = 3;
  // Optional; the role's maximum session duration when zero.
  int64 duration_seconds = 4;
  // Optional inline session policy (v1 JSON language, allow-only). Always
  // permitted; effective permissions are the intersection with the role's
  // grants.
  string session_policy_json = 5;
  // Required. Must be proof-of-possession; unspecified and Bearer are retained
  // only as historical enum values and are rejected by STS.
  SessionTokenType requested_token_type = 6;
}

message AssumeRoleWithWebIdentityResponse {
  string session_token = 1 [debug_redact = true]; // short-lived JWT; aud "motiveiq"
  string session_id = 2;    // "session_…" — the unique identifier (jti)
  string session_urn = 3;   // not unique across concurrent sessions
  string role_urn = 4;
  google.protobuf.Timestamp expire_time = 5;
  // Always proof-of-possession for newly issued sessions.
  SessionTokenType session_token_type = 6;
  string proof_key_thumbprint = 7;
}

message GetCallerIdentityRequest {}

message GetCallerIdentityResponse {
  string session_id = 1;
  string session_urn = 2;
  string role_urn = 3;
  string session_name = 4;
  google.protobuf.Timestamp expire_time = 5;
}
